[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Multimodal research assistant over arXiv RAG papers"
requires-python = ">=3.10"
dependencies = [
    "requests", "jsonschema", "pymupdf", "numpy", "faiss-cpu", "rank_bm25", "sentence-transformers",
    "open_clip_torch",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Needed from milestone 2 on (parsing, indexing, UI); not installed by `make setup`.
full = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
