<text x="508" y="374" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Retrieve</text>
<text x="508" y="404" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">dense + BM25</text>
<text x="508" y="427" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">search, then</text>
<text x="508" y="450" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">rerank</text>
<rect x="623" y="310" width="138" height="220" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.25"/>
<text x="692" y="374" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Generate</text>
<text x="692" y="404" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">LLM answers as</text>
<text x="692" y="427" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">claims, each with</text>
<text x="692" y="450" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#57534e">cited chunk IDs</text>
